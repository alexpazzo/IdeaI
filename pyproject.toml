[project]
name = "ideai"
version = "0.1.0"
description = "IdeaI — catalogo di idee imprenditoriali estratte da conversazioni pubbliche"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [{ name = "IdeaI" }]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "asyncpraw",
    "structlog",
    "prometheus-client",
    "typer",
    "pyyaml",
]

[project.scripts]
ideai = "ideai.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ideai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# La prima migrazione è la copia verbatim del DDL normativo (Appendice B):
# le righe lunghe sono parte del testo autorevole, non stile.
"migrations/versions/*.py" = ["E501"]
